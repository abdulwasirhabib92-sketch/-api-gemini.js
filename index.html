<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SMART FARM</title>

<style>
:root{
  --bg:#0b1220;
  --card:#111827;
  --green:#22c55e;
  --text:#e5e7eb;
}

*{box-sizing:border-box;font-family:Segoe UI,sans-serif}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  background:#020617;
}

/* DASHBOARD */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
}

.value{
  font-size:24px;
  margin-top:10px;
}

/* FLOATING AI */
.ai-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--green);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:24px;
}

/* CHAT */
.chat-box{
  position:fixed;
  bottom:90px;
  right:20px;
  width:300px;
  height:400px;
  background:#020617;
  border-radius:12px;
  display:none;
  flex-direction:column;
}

.chat-box.show{display:flex;}

.messages{
  flex:1;
  padding:10px;
  overflow:auto;
}

.msg{
  margin:5px 0;
  padding:8px;
  border-radius:8px;
}

.user{background:#22c55e;color:black}
.ai{background:#1f2937}

.input{
  display:flex;
}

input{
  flex:1;
  padding:10px;
  border:none;
  background:#111827;
  color:white;
}

button{
  padding:10px;
  background:var(--green);
  border:none;
}
</style>
</head>

<body>

<header>
  <div>🌿 SMART FARM</div>
</header>

<div class="container">
  <div class="card"><h3>Temperature</h3><div id="temp" class="value"></div></div>
  <div class="card"><h3>Humidity</h3><div id="hum" class="value"></div></div>
</div>

<!-- AI BUTTON -->
<div class="ai-btn" onclick="toggleChat()">🤖</div>

<!-- CHAT -->
<div class="chat-box" id="chatBox">
  <div class="messages" id="msgs"></div>
  <div class="input">
    <input id="input" placeholder="Ask farm AI..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
let data = {temp:25,hum:60};

function update(){
  data.temp += (Math.random()-0.5)*2;
  data.hum += (Math.random()-0.5)*2;

  temp.innerText = data.temp.toFixed(1)+"°C";
  hum.innerText = data.hum.toFixed(1)+"%";
}

setInterval(update,2000);
update();

/* CHAT UI */
function toggleChat(){
  chatBox.classList.toggle("show");
}

function addMsg(text,type){
  let div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

/* SEND MESSAGE */
async function send(){
  let inputEl = document.getElementById("input");
  let message = inputEl.value.trim();
  if(!message) return;

  addMsg(message,"user");
  inputEl.value="";

  let loading = document.createElement("div");
  loading.className="msg ai";
  loading.innerText="Thinking...";
  msgs.appendChild(loading);

  try{
    let res = await fetch("/api/gemini",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });

    let data = await res.json();

    msgs.removeChild(loading);

    if(data.reply){
      addMsg(data.reply,"ai");
    }else{
      addMsg("⚠️ Error: "+(data.error || "Unknown error"),"ai");
    }

  }catch(err){
    msgs.removeChild(loading);
    addMsg("❌ Network error. Try again.","ai");
  }
}
</script>

</body>
</html>
