<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Farm Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --green:#4caf50;
  --dark:#2e7d32;
  --bg:#f5f7f5;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

.topbar{
  background:white;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.value{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.chart-box{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-top:20px;
}

.chat-toggle{
  position:fixed;
  right:20px;
  bottom:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--green);
  color:white;
  border:none;
  cursor:pointer;
  font-size:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  z-index: 1000;
}

.chatbox{
  position:fixed;
  right:20px;
  bottom:90px;
  width:350px;
  height:540px;
  background:white;
  border-radius:15px;
  overflow:hidden;
  display:none;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
  z-index: 1000;
}

.chat-header{
  background:var(--dark);
  color:white;
  padding:15px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#fafafa;
}

.msg{
  margin-bottom:12px;
  padding:10px 14px;
  border-radius:12px;
  max-width:80%;
  line-height:1.4;
  word-wrap: break-word;
}

.user{
  background:var(--green);
  color:white;
  margin-left:auto;
}

.ai{
  background:#e9e9e9;
}

/* Style for embedded image items inside chat logs */
.chat-img-preview {
  max-width: 100%;
  border-radius: 8px;
  margin-top: 5px;
  display: block;
}

.camera-container {
  display: none;
  background: #000;
  position: relative;
  width: 100%;
  height: 200px;
}

.camera-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.camera-controls {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.cam-btn {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  border: 1px solid #fff;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
}

.chat-input{
  display:flex;
  border-top:1px solid #ddd;
  background: white;
}

.chat-input input{
  flex:1;
  border:none;
  padding:15px;
  outline:none;
}

.action-btn {
  border:none;
  background: none;
  font-size: 18px;
  padding: 0 12px;
  cursor: pointer;
  color: #555;
  transition: color 0.2s;
}

.action-btn:hover {
  color: var(--green);
}

#sendBtn {
  background:var(--dark);
  color:white;
  padding:0 20px;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">🌱 SMART FARM</div>
  <div>
    Temp:
    <span id="navTemp">24</span>°C
  </div>
</div>

<div class="container">

  <div class="grid">

    <div class="card">
      <h3>Temperature</h3>
      <div class="value">
        <span id="temp">24</span>°C
      </div>
    </div>

    <div class="card">
      <h3>Humidity</h3>
      <div class="value">
        <span id="humidity">55</span>%
      </div>
    </div>

    <div class="card">
      <h3>Soil Moisture</h3>
      <div class="value">
        <span id="soil">42</span>%
      </div>
    </div>

    <div class="card">
      <h3>Light Intensity</h3>
      <div class="value">
        <span id="light">67</span>%
      </div>
    </div>

  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

</div>

<button class="chat-toggle" onclick="toggleChat()">
💬
</button>

<div class="chatbox" id="chatbox">

  <div class="chat-header">
    <span>Farm AI Assistant</span>
  </div>

  <div class="camera-container" id="cameraContainer">
    <video id="video" autoplay playsinline></video>
    <div class="camera-controls">
      <button class="cam-btn" onclick="capturePhoto()">📸 Capture</button>
      <button class="cam-btn" onclick="stopCamera()">❌ Close</button>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg ai">
      Hello farmer 👋 Ask me anything about your farm, crop health, or click the camera icon to scan/diagnose plant leaves!
    </div>
  </div>

  <div class="chat-input">
    <button class="action-btn" onclick="startCamera()" title="Scan leaf / Take Photo">📷</button>
    
    <input
      id="input"
      placeholder="Ask AI or describe issue..."
      onkeydown="if(event.key==='Enter')send()"
    />

    <button id="sendBtn" onclick="send()">
      Send
    </button>
  </div>

</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

<script>

// LIVE METRICS
let currentMetrics = {
  temp:24,
  humidity:55,
  soil:42,
  light:67
};

// Global streaming objects
let videoStream = null;
let pendingImageBase64 = null;

// CHART
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx,{
  type:"line",
  data:{
    labels:["Start"],
    datasets:[{
      label:"Temperature",
      data:[24],
      borderColor:"#4caf50",
      backgroundColor:"rgba(76,175,80,0.1)",
      fill:true,
      tension:0.4
    }]
  },
  options:{
    responsive:true
  }
});

// SIMULATION
setInterval(()=>{

  currentMetrics.temp =
    +(currentMetrics.temp + (Math.random()-0.5)).toFixed(1);

  currentMetrics.humidity =
    +(currentMetrics.humidity + (Math.random()-0.5)*2).toFixed(1);

  currentMetrics.soil =
    +(currentMetrics.soil + (Math.random()-0.5)*1.5).toFixed(1);

  currentMetrics.light =
    +(currentMetrics.light + (Math.random()-0.5)*2).toFixed(1);

  document.getElementById("temp").innerText =
    currentMetrics.temp;

  document.getElementById("humidity").innerText =
    currentMetrics.humidity;

  document.getElementById("soil").innerText =
    currentMetrics.soil;

  document.getElementById("light").innerText =
    currentMetrics.light;

  document.getElementById("navTemp").innerText =
    currentMetrics.temp;

  let time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);

  chart.data.datasets[0].data.push(currentMetrics.temp);

  if(chart.data.labels.length > 10){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }

  chart.update();

},3000);

// CHAT TOGGLE
function toggleChat(){
  let box = document.getElementById("chatbox");
  if(box.style.display === "flex"){
    box.style.display = "none";
    stopCamera();
  }else{
    box.style.display = "flex";
  }
}

// CAMERA MANAGEMENT FUNCTIONS
async function startCamera() {
  const container = document.getElementById("cameraContainer");
  const video = document.getElementById("video");
  container.style.display = "block";
  
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }, // Prioritize back camera on mobile phones
      audio: false
    });
    video.srcObject = videoStream;
  } catch (err) {
    console.error("Camera access error:", err);
    alert("Could not access camera. Please check your system/browser permissions.");
    container.style.display = "none";
  }
}

function stopCamera() {
  const container = document.getElementById("cameraContainer");
  container.style.display = "none";
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
  }
}

function capturePhoto() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("captureCanvas");
  const ctx = canvas.getContext("2d");
  
  if (!videoStream) return;
  
  // Set scaling context dimensions equal to actual incoming streaming video resolution
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  // Render frame to hidden canvas element
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  
  // Extract compressed base64 data URL payload representation
  pendingImageBase64 = canvas.toDataURL("image/jpeg", 0.7);
  
  // Stop camera feedback window loop
  stopCamera();
  
  // Visually present captured snapshot into the dialog timeline
  appendImageMessage(pendingImageBase64, "user");
}

// ADD STANDARD MESSAGE
function addMessage(text,type){
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// APPEND VISUAL IMAGE CARD
function appendImageMessage(base64Src, type) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.innerText = "📸 Captured Farm Image Scan:";
  
  const img = document.createElement("img");
  img.src = base64Src;
  img.className = "chat-img-preview";
  
  div.appendChild(img);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// FETCH DESCRIPTOR SUBMISSION
async function send(){
  const input = document.getElementById("input");
  let message = input.value.trim();

  // If there is no text but there is a photo, supply a default query string
  if (!message && pendingImageBase64) {
    message = "Please analyze this crop scan image for anomalies or diseases.";
  }

  if(!message && !pendingImageBase64) return;

  if (message && !pendingImageBase64) {
    addMessage(message,"user");
  }

  input.value = "";
  
  // Snapshot the current payload state locally and clear global queue references
  const imageToSend = pendingImageBase64;
  pendingImageBase64 = null;

  addMessage("🌱 Analyzing farm context...","ai");

  try{
    const response = await fetch("/api/gemini",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message,
        liveData:currentMetrics,
        image: imageToSend // Pass base64 data string payload across wire
      })
    });

    const data = await response.json();
    const allMsgs = document.querySelectorAll(".ai");
    const loading = allMsgs[allMsgs.length - 1];

    if(data.reply){
      loading.innerText = data.reply;
    }else{
      loading.innerText = "Error: " + (data.error || "Unknown");
      console.log(data);
    }

  }catch(err){
    console.error(err);
    const allMsgs = document.querySelectorAll(".ai");
    const loading = allMsgs[allMsgs.length - 1];
    loading.innerText = "Connection error: " + err.message;
  }
}

</script>

</body>
</html>
