<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --green:#22c55e;
  --bg-dark:#0f172a;
  --card-dark:#1e293b;
  --text-dark:#e2e8f0;
}

body{
  margin:0;
  font-family:Segoe UI, sans-serif;
  background:var(--bg-dark);
  color:var(--text-dark);
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:15px 20px;
  background:#020617;
}

.menu span{
  margin:0 8px;
  padding:6px 10px;
  cursor:pointer;
}

.active{
  background:var(--green);
  border-radius:6px;
}

/* STATUS */
.status{
  margin:15px;
  padding:12px;
  background:var(--card-dark);
  border-radius:10px;
  text-align:center;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:var(--card-dark);
  padding:15px;
  border-radius:12px;
}

.bar{
  height:6px;
  background:#334155;
  border-radius:5px;
}

.fill{
  height:6px;
  background:var(--green);
}

/* MAIN */
.main{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
  padding:15px;
}

@media(min-width:768px){
  .main{
    grid-template-columns:2fr 1fr;
  }
}

.panel{
  background:var(--card-dark);
  padding:15px;
  border-radius:12px;
}

/* CHAT */
.chat{
  position:fixed;
  bottom:0;
  right:0;
  width:100%;
  max-width:350px;
  background:#020617;
  border-top-left-radius:12px;
  display:flex;
  flex-direction:column;
}

.messages{
  height:250px;
  overflow:auto;
  padding:10px;
}

.msg{
  margin:6px 0;
  padding:8px;
  border-radius:8px;
}

.user{background:var(--green);color:black}
.ai{background:#334155}

.input{
  display:flex;
}

input{
  flex:1;
  padding:10px;
  border:none;
  background:#1e293b;
  color:white;
}

button{
  background:var(--green);
  border:none;
  padding:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="nav">
  <b>🌿 SMART FARM</b>
  <div class="menu">
    <span class="active">Dashboard</span>
    <span>Zones</span>
    <span>Alerts</span>
  </div>
</div>

<div class="status">✅ System Healthy</div>

<div class="grid">
  <div class="card"><h3>Temp</h3><h2>23°C</h2><div class="bar"><div class="fill" style="width:50%"></div></div></div>
  <div class="card"><h3>Humidity</h3><h2>56%</h2><div class="bar"><div class="fill" style="width:56%"></div></div></div>
  <div class="card"><h3>Soil</h3><h2>42%</h2><div class="bar"><div class="fill" style="width:42%"></div></div></div>
</div>

<div class="main">
  <div class="panel">
    <h3>Trends</h3>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h3>Alerts</h3>
    <p>⚠ Low moisture</p>
    <p>✅ Irrigation done</p>
  </div>
</div>

<!-- CHAT -->
<div class="chat">
  <div class="messages" id="msgs"></div>
  <div class="input">
    <input id="input" placeholder="Ask AI..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
// chart
new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:["1","2","3","4","5"],
    datasets:[{data:[22,24,21,23,25]}]
  }
});

// chat
function addMsg(text,type){
  let div=document.createElement("div");
  div.className="msg "+type;
  div.innerText=text;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

async function send(){
  let inputEl=document.getElementById("input");
  let message=inputEl.value.trim();
  if(!message) return;

  addMsg(message,"user");
  inputEl.value="";

  let loading=document.createElement("div");
  loading.className="msg ai";
  loading.innerText="Thinking...";
  msgs.appendChild(loading);

  try{
    let res=await fetch("/api/gemini",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });

    let data=await res.json();
    msgs.removeChild(loading);

    if(data.reply){
      addMsg(data.reply,"ai");
    }else{
      addMsg("⚠ Error: "+(data.error||"Unknown"),"ai");
    }

  }catch(err){
    msgs.removeChild(loading);
    addMsg("❌ Network error","ai");
  }
}
</script>

</body>
</html>
