<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Farm Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --green:#4caf50;
  --dark:#2e7d32;
  --bg:#f5f7f5;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
}

.topbar{
  background:white;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
  font-weight:bold;
  font-size:20px;
}

.container{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.value{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.chart-box{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-top:20px;
}

.chat-toggle{
  position:fixed;
  right:20px;
  bottom:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--green);
  color:white;
  border:none;
  cursor:pointer;
  font-size:24px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
}

.chatbox{
  position:fixed;
  right:20px;
  bottom:90px;
  width:350px;
  height:500px;
  background:white;
  border-radius:15px;
  overflow:hidden;
  display:none;
  flex-direction:column;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.chat-header{
  background:var(--dark);
  color:white;
  padding:15px;
  font-weight:bold;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#fafafa;
}

.msg{
  margin-bottom:12px;
  padding:10px 14px;
  border-radius:12px;
  max-width:80%;
  line-height:1.4;
}

.user{
  background:var(--green);
  color:white;
  margin-left:auto;
}

.ai{
  background:#e9e9e9;
}

.chat-input{
  display:flex;
  border-top:1px solid #ddd;
}

.chat-input input{
  flex:1;
  border:none;
  padding:15px;
  outline:none;
}

.chat-input button{
  border:none;
  background:var(--dark);
  color:white;
  padding:0 20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="logo">🌱 SMART FARM</div>
  <div>
    Temp:
    <span id="navTemp">24</span>°C
  </div>
</div>

<div class="container">

  <div class="grid">

    <div class="card">
      <h3>Temperature</h3>
      <div class="value">
        <span id="temp">24</span>°C
      </div>
    </div>

    <div class="card">
      <h3>Humidity</h3>
      <div class="value">
        <span id="humidity">55</span>%
      </div>
    </div>

    <div class="card">
      <h3>Soil Moisture</h3>
      <div class="value">
        <span id="soil">42</span>%
      </div>
    </div>

    <div class="card">
      <h3>Light Intensity</h3>
      <div class="value">
        <span id="light">67</span>%
      </div>
    </div>

  </div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

</div>

<button class="chat-toggle" onclick="toggleChat()">
💬
</button>

<div class="chatbox" id="chatbox">

  <div class="chat-header">
    Farm AI Assistant
  </div>

  <div class="messages" id="messages">

    <div class="msg ai">
      Hello farmer 👋 Ask me about your farm metrics.
    </div>

  </div>

  <div class="chat-input">
    <input
      id="input"
      placeholder="Ask AI..."
      onkeydown="if(event.key==='Enter')send()"
    />

    <button onclick="send()">
      Send
    </button>
  </div>

</div>

<script>

// LIVE METRICS
let currentMetrics = {
  temp:24,
  humidity:55,
  soil:42,
  light:67
};

// CHART
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx,{
  type:"line",
  data:{
    labels:["Start"],
    datasets:[{
      label:"Temperature",
      data:[24],
      borderColor:"#4caf50",
      backgroundColor:"rgba(76,175,80,0.1)",
      fill:true,
      tension:0.4
    }]
  },
  options:{
    responsive:true
  }
});

// SIMULATION
setInterval(()=>{

  currentMetrics.temp =
    +(currentMetrics.temp + (Math.random()-0.5)).toFixed(1);

  currentMetrics.humidity =
    +(currentMetrics.humidity + (Math.random()-0.5)*2).toFixed(1);

  currentMetrics.soil =
    +(currentMetrics.soil + (Math.random()-0.5)*1.5).toFixed(1);

  currentMetrics.light =
    +(currentMetrics.light + (Math.random()-0.5)*2).toFixed(1);

  document.getElementById("temp").innerText =
    currentMetrics.temp;

  document.getElementById("humidity").innerText =
    currentMetrics.humidity;

  document.getElementById("soil").innerText =
    currentMetrics.soil;

  document.getElementById("light").innerText =
    currentMetrics.light;

  document.getElementById("navTemp").innerText =
    currentMetrics.temp;

  let time = new Date().toLocaleTimeString();

  chart.data.labels.push(time);

  chart.data.datasets[0].data.push(currentMetrics.temp);

  if(chart.data.labels.length > 10){
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }

  chart.update();

},3000);

// CHAT TOGGLE
function toggleChat(){

  let box = document.getElementById("chatbox");

  if(box.style.display === "flex"){
    box.style.display = "none";
  }else{
    box.style.display = "flex";
  }
}

// ADD MESSAGE
function addMessage(text,type){

  const messages =
    document.getElementById("messages");

  const div =
    document.createElement("div");

  div.className =
    "msg " + type;

  div.innerText =
    text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}

// FETCH TARGETS STANDARD VERCEL STRUCTURE
async function send(){

  const input =
    document.getElementById("input");

  const message =
    input.value.trim();

  if(!message) return;

  addMessage(message,"user");

  input.value = "";

  addMessage("🌱 Thinking...","ai");

  try{

    const response =
      await fetch("/api/gemini",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message,
        liveData:currentMetrics
      })

    });

    const data =
      await response.json();

    const allMsgs =
      document.querySelectorAll(".ai");

    const loading =
      allMsgs[allMsgs.length - 1];

    if(data.reply){

      loading.innerText =
        data.reply;

    }else{

      loading.innerText =
        "Error: " +
        (data.error || "Unknown");

      console.log(data);
    }

  }catch(err){

    console.error(err);

    const allMsgs =
      document.querySelectorAll(".ai");

    const loading =
      allMsgs[allMsgs.length - 1];

    loading.innerText =
      "Connection error: " +
      err.message;
  }
}

</script>

</body>
</html>
